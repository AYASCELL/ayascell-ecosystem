<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#1A233A" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="108" height="108" rx="24" fill="url(#bgGrad)" />

  <!-- Background Radar / Seismic Wave Rings -->
  <circle cx="54" cy="54" r="40" fill="none" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.2" />
  <circle cx="54" cy="54" r="28" fill="none" stroke="#EF4444" stroke-width="1" stroke-opacity="0.25" />

  <!-- Foreground Group (Scale 0.85 centered at 54,54) -->
  <g transform="translate(54,54) scale(0.85) translate(-54,-54)">
    <!-- Globe Outer Ring -->
    <circle cx="54" cy="54" r="36" fill="none" stroke="#38BDF8" stroke-width="3" />

    <!-- Latitude / Longitude grid lines -->
    <path d="M18,54 H90 M54,18 V90" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.4" />

    <!-- Expanding Seismic Pulse Wave Rings -->
    <circle cx="54" cy="54" r="26" fill="none" stroke="#EF4444" stroke-width="2.5" stroke-opacity="0.5" />
    <circle cx="54" cy="54" r="16" fill="none" stroke="#EF4444" stroke-width="3" stroke-opacity="0.7" />

    <!-- Seismograph Pulse Line across Earth -->
    <path d="M12,54 L34,54 L40,32 L48,74 L56,22 L64,68 L70,48 L76,54 L96,54" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Epicenter Core Glowing Red Circle -->
    <circle cx="56" cy="22" r="6" fill="#EF4444" />
    <circle cx="56" cy="22" r="2.5" fill="#FFFFFF" />
  </g>
</svg>
